# Outflow — local development environment
# Run: docker compose -f docker-compose.dev.yml up -d
#
# Services:
#   postgres  - Postgres 16 with pgvector + citext extensions enabled
#   redis     - Redis 7 for queues + cache
#   mailhog   - SMTP catcher so we can verify outgoing emails locally
#   minio     - S3-compatible object storage for CSV uploads in dev
#
# The api/web apps are typically run via `pnpm dev` on the host for fast HMR.
# A `compose.full.yml` (built later) will containerize them for prod-like testing.

name: outflow-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: outflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outflow_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-outflow}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-outflow} -d ${POSTGRES_DB:-outflow}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: outflow-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: outflow-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

  minio:
    image: minio/minio:latest
    container_name: outflow-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: outflow_minio
      MINIO_ROOT_PASSWORD: outflow_minio_pw
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
