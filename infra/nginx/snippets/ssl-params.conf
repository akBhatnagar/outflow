# SSL parameters — Mozilla Intermediate config, Apr 2024
# https://ssl-config.mozilla.org/#server=nginx&version=1.27.0&config=intermediate
ssl_session_timeout 1d;
ssl_session_cache shared:OutflowSSL:10m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

# OCSP stapling
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# HSTS (1 year, includeSubDomains). Safe to enable from day one because we
# only ever serve outflow.akshaybhatnagar.in over HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
