# Conservative browser security headers. Most overlap with what Helmet sets at
# the API layer, but defence in depth is fine — and the web (Next.js) side
# benefits from these too.
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection          "0" always;  # explicit off; modern CSP supersedes
add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
