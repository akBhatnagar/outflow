# Standard reverse-proxy headers used by every location block.
# Note: `map $http_upgrade $connection_upgrade` lives in nginx.conf because
# `map` directives are only valid in the http context.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket support (Next.js dev/HMR + future realtime in Phase 4+).
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_buffering off;
proxy_request_buffering off;
