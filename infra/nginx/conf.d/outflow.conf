# Outflow — public-facing virtual host for outflow.akshaybhatnagar.in
#
# Plumbing:
#   - api -> http://api:4000   (NestJS, paths under /api/* and /health/*)
#   - web -> http://web:3000   (Next.js, everything else)
#
# This file is mounted read-only into nginx; edits go to the host repo and
# require `docker compose exec nginx nginx -s reload` to take effect.

# Upstream defs make timeouts/keepalive easier to tune in one place.
upstream outflow_api {
    server api:4000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}
upstream outflow_web {
    server web:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# ---- HTTP: ACME challenge + permanent redirect to HTTPS ----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Cheap, public liveness URL for monitoring tools.
    location = /_health {
        access_log off;
        return 200 "ok\n";
    }

    # Let's Encrypt webroot challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: actual app ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name outflow.akshaybhatnagar.in;

    # Cert paths — populated by `init-letsencrypt.sh` then renewed by certbot.
    ssl_certificate     /etc/letsencrypt/live/outflow.akshaybhatnagar.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/outflow.akshaybhatnagar.in/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Browser security headers
    include /etc/nginx/snippets/security-headers.conf;

    # ---- API ----
    # NestJS owns:
    #   - /api/v1/...     business endpoints
    #   - /health/*        liveness/readiness/version
    #   - /docs            Swagger (dev only; disabled in prod app code)
    location /api/ {
        limit_req zone=api burst=120 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://outflow_api;
    }
    location /health/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://outflow_api;
    }

    # Tighter rate limit on auth-sensitive endpoints (defence in depth on top of
    # the in-app throttler).
    location ~ ^/api/v1/auth/(login|signup|forgot-password|reset-password) {
        limit_req zone=auth burst=20 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://outflow_api;
    }

    # ---- Web (Next.js) ----
    location / {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://outflow_web;
    }

    # Long-lived static assets that Next.js fingerprints.
    location /_next/static/ {
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://outflow_web;
    }
}
