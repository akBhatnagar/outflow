# Outflow — http-context directives that pair with sites-available/outflow.
#
# Drop this into /etc/nginx/conf.d/ — Ubuntu's default nginx.conf includes
# `/etc/nginx/conf.d/*.conf` from the http {} block. Anything that must live
# in http context (maps, limit_req_zone) goes here.

# Per-IP token-bucket rate limits used by the outflow vhost.
limit_req_zone $binary_remote_addr zone=outflow_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=outflow_api:10m  rate=60r/s;

# Websocket upgrade map. Any other vhost that needs $connection_upgrade can
# reference the same variable; map definitions are idempotent across files
# only if the names differ — check that nothing else on this host already
# defines a `connection_upgrade` map before installing this file.
map $http_upgrade $outflow_connection_upgrade {
    default upgrade;
    ''      close;
}
