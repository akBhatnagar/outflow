# Outflow — host-nginx server block.
#
# Pairs with `docker-compose.host-nginx.yml`, which binds the api + web
# containers to localhost:4001 and :3002 respectively. This file is dropped
# into `/etc/nginx/sites-available/outflow` and symlinked into
# `/etc/nginx/sites-enabled/`.
#
# First-time provisioning (no cert yet): the HTTP block alone is sufficient
# for certbot's webroot challenge. Once `certbot certonly --webroot` issues
# the cert, uncomment / keep the HTTPS block and reload nginx.

# ---- HTTP: ACME challenge + permanent redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name outflow.akshaybhatnagar.in;

    # Webroot used by certbot for HTTP-01 challenges. Certbot writes files to
    # /var/www/certbot/.well-known/acme-challenge/ and we serve them here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: actual app ----
server {
    # nginx 1.24 (Ubuntu 24.04) uses the old listen-line syntax for HTTP/2.
    # Bumping to nginx >= 1.25 lets you replace these with `listen 443 ssl;`
    # plus `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name outflow.akshaybhatnagar.in;

    ssl_certificate     /etc/letsencrypt/live/outflow.akshaybhatnagar.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/outflow.akshaybhatnagar.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Browser security headers — kept minimal because nestjs Helmet covers
    # most of what we need at the API layer. Adding HSTS only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    # Reasonable upload cap. Phase 5 CSV import grows this if needed.
    client_max_body_size 5m;

    # ---- API: NestJS, port 4001 on the host ----
    location ~ ^/api/v1/auth/(login|signup|forgot-password|reset-password) {
        # Tight per-IP cap on credential endpoints. Defence in depth on top of
        # the app-level ThrottlerGuard.
        limit_req zone=outflow_auth burst=20 nodelay;

        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /api/ {
        limit_req zone=outflow_api burst=120 nodelay;

        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /health/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Web: Next.js, port 3002 on the host ----
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Pass websocket upgrade through (Next dev tools, future realtime).
        # `$outflow_connection_upgrade` is defined in conf.d/outflow-zones.conf.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $outflow_connection_upgrade;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
